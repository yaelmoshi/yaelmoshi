when:
  - event: manual
  - event: cron
  - event: push
    branch: main

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652
    settings:
      lfs: false
      tags: false

steps:
  - name: validate-mirror-config
    image: dhi.io/node:26.8.1-alpine3.23-dev@sha256:b0b229a4eb970699f8de7716b6dc1f68e71d8e919f07797073532fb6d54a863d
    commands:
      - node --check scripts/sync-github-mirrors.mjs
    when:
      - event: push

  - name: sync-github-mirrors
    image: dhi.io/node:26.8.1-alpine3.23-dev@sha256:b0b229a4eb970699f8de7716b6dc1f68e71d8e919f07797073532fb6d54a863d
    environment:
      FORGEJO_PUSH_TOKEN:
        from_secret: forgejo_profile_push_token
      FORGEJO_PUSH_USER: m0sh1
      GITHUB_PUSH_TOKEN:
        from_secret: github_push_token
    commands:
      - apk add --no-cache ca-certificates git
      - node scripts/sync-github-mirrors.mjs
    when:
      - event: manual
      - event: cron
