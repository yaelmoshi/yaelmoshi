when:
  - event: manual
  - event: cron

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.3@sha256:b2d65ece33918fd8763192effb11b226ff4631faa1f3568c941ae69462b1f1be
    settings:
      lfs: false
      tags: false

steps:
  - name: sync-github-mirrors
    image: dhi.io/node:26.2.0-alpine3.23-dev@sha256:88d721c72f82cc1522b4900750bdc7cc7191e73d5b9b5343d8e970ef4a3cf5d1
    environment:
      FORGEJO_PUSH_TOKEN:
        from_secret: forgejo_profile_push_token
      FORGEJO_PUSH_USER: m0sh1
      GITHUB_PUSH_TOKEN:
        from_secret: github_push_token
    commands:
      - apk add --no-cache ca-certificates git
      - node scripts/sync-github-mirrors.mjs
